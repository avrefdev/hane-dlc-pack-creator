[package]
name = "hane-dlc-pack-creator"
version = "1.1.1"
description = "Creates ready to fill GTA V DLC packs"
authors = ["Aref"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "hane_dlc_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
